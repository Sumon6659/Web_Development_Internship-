<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2 id="out" style="font-family:system-ui;padding:16px"></h2>
    <script>
        const age = 18;
        let label;
        if (age >= 18) label = "Adult";
        else if (age >= 13) label = "Teen";
        else label = "Child";
        document.getElementById("out").textContent = "Age " + age + " → " + label;
    </script>
</body>

</html>
