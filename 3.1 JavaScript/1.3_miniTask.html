<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <pre id="out" style="font:14px/1.5 monospace;padding:16px;background:#f5f5f5">

     </pre>
    <script>
        const log = (m) => document.getElementById("out").textContent += m + "\n";
        const name = "Hanjala", age = 22, active = true;
        const fruits = ["Apple", "Watermelon"];
        const user = { name: "Shahira", age: 21 };
        log("String: " + name + "(typeof " + typeof name + ")");
        log("number:" + age);
        log("boolean:" + active);
        log("Array[0]:" + fruits[0]);
        log("Object.name:" + user.name);

    </script>
</body>

</html>
