<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;700&family=Playfair+Display=swap" rel="stylesheet">
    <style>
        body{
            font-family: 'Poppins', sans-serif; padding:40px;background:#fafafa
        }
        h1{font-family: 'Playfair Display', serif; font-size: 48px; color:#222; }
        h2{color:#d9534f; text-transform: uppercase; letter-spacing: 3px}
        p{line-height: 1.7; color:#444; max-width: 600px;}
        p:first-of-type::first-latter{font-size: 42px; color:#d9534f; font-weight:bold;}
        a{color:#457d9d;}
        a:hover{color:#e63946; text-decoration:none;}


    </style>
</head>
<body>
    <h1> The art of Typography</h1>
    <h2>Introduction</h2>
    <p> Typography is the technique to show the words nicely. A good typography can make a big difference in the readability and aesthetics of a design.</p>

</body>
</html>
