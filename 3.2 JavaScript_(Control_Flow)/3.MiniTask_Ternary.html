<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ternary and Switch</title>
</head>

<body>

    <h2 id="out" style="font-family:system-ui; padding:16px;"></h2>

    <h2 id="dayOut" style="font-family:system-ui; padding:16px;"></h2>

    <script>
       
        const age = 20;

        const msg = age >= 18 ? "Adult" : "Minor";

        document.getElementById("out").textContent =
            "Age " + age + " → " + msg;


   
    </script>

</body>
</html>
